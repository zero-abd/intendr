name = "intendr-edge"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
# account chosen at deploy via the CLOUDFLARE_ACCOUNT_ID env var (kept out of the repo).

# Persistent per-workspace wallet (cumulative spend + live cap).
[[durable_objects.bindings]]
name = "WALLET_DO"
class_name = "WalletDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WalletDO"]

# Secrets (set out-of-band, never committed):
#   echo "<key>"        | wrangler secret put ORTHOGONAL_API_KEY
#   printf '%s' "<url>" | wrangler secret put SUPABASE_URL
#   printf '%s' "<key>" | wrangler secret put SUPABASE_SERVICE_KEY   # service_role
#
# The wallet + transactions live in the shared Supabase project, per-user (auth.users.id).
# Canonical schema: apps/web/supabase/schema.sql (+ MCP RPCs mcp_wallet / mcp_charge).
# WALLET_DO below is vestigial (superseded by Supabase) — safe to remove in a later migration.
