name = "intendr-edge"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# --- Durable Objects: one per wallet/workspace ---
[durable_objects]
bindings = [{ name = "WALLET_DO", class_name = "WalletDO" }]

[[migrations]]
tag = "v1"
new_classes = ["WalletDO"]

