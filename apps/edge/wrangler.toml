name = "intendr-edge"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "REDACTED_CF_ACCOUNT"

# Persistent per-workspace wallet (cumulative spend + live cap).
[[durable_objects.bindings]]
name = "WALLET_DO"
class_name = "WalletDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WalletDO"]

